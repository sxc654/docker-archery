; Archery 容器进程管理：supervisord 作 PID 1，日志直出 docker logs
; 用法：/opt/venv4archery/bin/supervisord -c /opt/archery/docker/supervisord.conf
; 查看状态：/opt/venv4archery/bin/supervisorctl -c /opt/archery/docker/supervisord.conf status
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:gunicorn]
command=/opt/venv4archery/bin/gunicorn -w %(ENV_GUNICORN_WORKERS)s -b 0.0.0.0:8888 --timeout %(ENV_GUNICORN_TIMEOUT)s --access-logfile - --error-logfile - archery.wsgi:application
directory=/opt/archery
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
priority=10

[program:qcluster]
command=/opt/venv4archery/bin/python manage.py qcluster
directory=/opt/archery
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
priority=20
